target_height_px: 16
ink_threshold: 250
ignore_punctuation_in_glyph_height: true
padding_target_px: 16
line_spacing_target_px: 8
canvas_multiple: 6
ratio_grid:
  start: 1.0
  stop: 3.0
  count: 16
  extra: [2.625]
resampling:
  binning: [floor, ceil]
  bilinear: [opencv, floating, fixed_point]
  lanczos:
    variants: [2, 3]
    taps: 7
    phases: 16
  interpolation: shift
fonts:
  en:
    path: fonts/Consolas-Regular.ttf
    index: 0
    expected_family: Consolas
  zh_tra:
    path: fonts/microsoft-jhenghei.ttf
    index: 0
    expected_family: Microsoft JhengHei
tesseract:
  executable: tesseract
  tessdata_dir: tessdata
  oem: 1
  timeout_seconds: 60
patterns:
  - id: en_char_a
    language: en
    layout: single_char
    psm: 10
    text: "A"
  - id: zh_char_01
    language: zh_tra
    layout: single_char
    psm: 10
    text: "做"
  - id: zh_char_02
    language: zh_tra
    layout: single_char
    psm: 10
    text: "剪"
  - id: zh_line_01
    language: zh_tra
    layout: single_line
    psm: 7
    text: "做假停偷側推售問"
