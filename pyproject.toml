[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-resampling-bench"
version = "0.1.0"
description = "Controlled 16-pixel English and Traditional Chinese OCR resampling benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "CairoSVG>=2.7",
  "fonttools>=4.50",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pandas>=2.2",
  "Pillow>=10.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ocr-bench = "ocr_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
